name: Calculator checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("shiny", "rmarkdown", "testthat"))'
      - name: Install PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Run calculation, report and Shiny server checks
        run: Rscript scripts/run_tests.R
      - name: Generate worked reports
        run: Rscript examples/worked_example.R
      - uses: actions/upload-artifact@v4
        with:
          name: worked-example-reports
          path: output/
