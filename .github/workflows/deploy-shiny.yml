
name: Deploy Shiny App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiny-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install deployment tools
        shell: Rscript {0}
        run: |
          install.packages(c("renv", "rsconnect"))

      - name: Validate Shiny application
        shell: Rscript {0}
        run: |
          stopifnot(file.exists("app.R"))
          stopifnot(file.exists("renv.lock"))
          parse(file = "app.R")
          cat("Entry point validated.\n")

      - name: Restore application dependencies
        shell: Rscript {0}
        env:
          CALCULATOR_USE_RENV: "true"
        run: |
          renv::restore(prompt = FALSE)
          print(renv::status())

      - name: Validate deployment dependencies
        shell: Rscript {0}
        run: |
          deps <- rsconnect::appDependencies(".")
          print(deps)
          stopifnot(nrow(deps) > 0)

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          required <- c(
            "SHINYAPPS_ACCOUNT",
            "SHINYAPPS_TOKEN",
            "SHINYAPPS_SECRET"
          )

          missing <- required[
            !nzchar(Sys.getenv(required))
          ]

          if (length(missing)) {
            stop(
              "Missing secrets: ",
              paste(missing, collapse = ", ")
            )
          }

          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appDir = ".",
            appName = "sample-size-calculator",
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
